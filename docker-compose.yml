services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    # Local dev only: expose DB port to host for GUI clients (psql, TablePlus).
    # Remove this ports block in production; DB is reachable only on the internal Docker network.
    ports:
      - "5432:5432"
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  api:
    build: ./api
    ports:
      - "4000:4000"
    depends_on:
      - postgres
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY}

  web:
    build:
      context: ./web
      args:
        # Browser-side JS is baked at build time — use the host-accessible URL
        NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - api
    environment:
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: http://localhost:3000

      # Server-side-only: NextAuth authorize() uses this at runtime so it can reach the API
      # on the internal Docker network (NEXT_PUBLIC_API_URL is baked at build time for the browser)
      INTERNAL_API_URL: http://api:4000

volumes:
  postgres_data:
